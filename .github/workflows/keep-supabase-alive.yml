# Mban databazën Supabase (plani falas) gjallë: e "troket" çdo 2 ditë,
# që të mos pauzohet pas 7 ditësh pa aktivitet.
name: Keep Supabase alive

on:
  schedule:
    - cron: '17 6 */2 * *' # çdo 2 ditë, në mëngjes
  workflow_dispatch:

permissions:
  contents: read
  actions: write # që GitHub të mos e çaktivizojë këtë detyrë pas 60 ditësh

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(grep -oP "SUPABASE_URL = '\K[^']+" src/lib/supabase.js)
          KEY=$(grep -oP "SUPABASE_ANON_KEY = '\K[^']+" src/lib/supabase.js)
          CODE=$(curl -s -o /tmp/out.json -w "%{http_code}" \
            -H "apikey: $KEY" "$URL/rest/v1/properties?select=id&limit=1")
          echo "Supabase answered: HTTP $CODE"
          head -c 300 /tmp/out.json; echo
          if [ "$CODE" != "200" ]; then
            echo "::error::Supabase nuk u përgjigj (HTTP $CODE). Ndoshta projekti është pauzuar: hap supabase.com dhe shtyp 'Resume project'."
            exit 1
          fi
      - name: Keep this scheduled workflow enabled
        uses: gautamkrishnar/keepalive-workflow@v2
