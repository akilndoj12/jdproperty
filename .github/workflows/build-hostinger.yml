# Ndërton faqen për serverin e klientit (Hostinger) dhe e vendos te branch-i "hostinger".
# Hostinger mund ta tërheqë automatikisht këtë branch (hPanel → Git), ose
# skedarët mund të ngarkohen me dorë te public_html.
name: Build for Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build # base '/' – faqja në rrënjë të domain-it
      - name: Publish dist to "hostinger" branch
        run: |
          cd dist
          git init -q -b hostinger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" hostinger
