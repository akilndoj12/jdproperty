<!doctype html>
<html lang="en">
  <head>
    <!-- Kodimi i karaktereve -->
    <meta charset="UTF-8" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Titulli -->
    <title>JD Properties | Luxury Real Estate</title>

    <!-- Përshkrimi për Google -->
    <meta
      name="description"
      content="JD Properties helps you buy, sell, and rent luxury homes, apartments, villas, and commercial properties." />

    <!-- Fjalët kyçe -->
    <meta
      name="keywords"
      content="real estate, property, apartments, villas, houses, homes, buy house, rent apartment, JD Properties" />

    <!-- Autori -->
    <meta name="author" content="JD Properties" />

    <!-- Instruksione për robotët e Google -->
    <meta name="robots" content="index, follow" />

    <!-- Ikona -<link rel="icon" href="/favicon.ico" />-->

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:title" content="JD Properties" />
    <meta property="og:description" content="Luxury Real Estate - Buy, Sell & Rent Properties" />
    <meta property="og:image" content="/images/cover.jpg" />
    <meta property="og:url" content="https://jdproperties.com" />
    <meta property="og:type" content="website" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JD Properties" />
    <meta name="twitter:description" content="Luxury Real Estate - Buy, Sell & Rent" />
    <meta name="twitter:image" content="/images/cover.jpg" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet" />

    <!--   icons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
